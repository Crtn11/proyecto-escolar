<!doctype html>
<html lang="es">
  <head>
    <title>Verificación 2FA | Colegio Anáhuac</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0, minimal-ui" />
    <link rel="icon" href="assets/images/IconoColegioAnahuac.png" type="image/png" />
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/fonts/phosphor/regular/style.css" />
    <link rel="stylesheet" href="assets/fonts/tabler-icons.min.css" />
    <link rel="stylesheet" href="assets/css/style.css" id="main-style-link" />
    <link rel="stylesheet" href="assets/css/style-preset.css" />
    <style>
      .auth-main { background: #f4f7fa; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
      .auth-wrapper { width: 100%; max-width: 450px; padding: 15px; }
      .otp-input { text-align: center; font-size: 24px; letter-spacing: 10px; font-weight: bold; }
    </style>
  </head>
  <body data-pc-preset="preset-1" data-pc-sidebar-caption="true" data-pc-direction="ltr" data-pc-theme="light">
    <div class="auth-main">
      <div class="auth-wrapper">
        <div class="card mb-0">
          <div class="card-body text-center">
            <img src="assets/images/LogoColegioAnahuac.png" alt="img" class="img-fluid mb-4" style="max-height: 100px;" />
            <h4 class="f-w-500 mb-3">Verificación de Seguridad</h4>
            <p class="text-muted mb-4">Código enviado a: <br><strong id="displayEmail"></strong></p>
            <div class="mb-4"><input type="text" class="form-control otp-input" id="otpCode" maxlength="6" placeholder="000000" /></div>
            <button type="button" class="btn btn-primary shadow w-100" onclick="verifyOTP()">Verificar y Acceder</button>
            <a href="login.html" class="link-secondary d-block mt-3">Volver al inicio</a>
          </div>
        </div>
      </div>
    </div>
    <script>
      document.getElementById('displayEmail').innerText = localStorage.getItem('portal_user_email') || 'usuario@anahuac.mx';
      function verifyOTP() {
        const otp = document.getElementById('otpCode').value;
        const role = localStorage.getItem('portal_user_role');
        if (otp.length === 6) {
          switch(role) {
            case 'alumno': window.location.href = 'dashboards/Alumnos/index.html'; break;
            case 'profesor': window.location.href = 'dashboards/Profesores/index.html'; break;
            case 'administrativo': window.location.href = 'dashboards/Administrativos/index.html'; break;
            case 'sistemas': window.location.href = 'dashboards/Sistemas/index.html'; break;
            default: window.location.href = 'dashboards/Alumnos/index.html';
          }
        } else { alert('Ingresa los 6 dígitos.'); }
      }
    </script>
  </body>
</html>
