<!doctype html>
<html lang="es">
  <head>
    <title>Login | Portal Colegio Anáhuac</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0, minimal-ui" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- [Favicon] icon -->
    <link rel="icon" href="assets/images/IconoColegioAnahuac.png" type="image/png" />
    <!-- [Font] Family -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <!-- [phosphor Icons] -->
    <link rel="stylesheet" href="assets/fonts/phosphor/regular/style.css" />
    <!-- [Tabler Icons] -->
    <link rel="stylesheet" href="assets/fonts/tabler-icons.min.css" />
    <!-- [Template CSS Files] -->
    <link rel="stylesheet" href="assets/css/style.css" id="main-style-link" />
    <link rel="stylesheet" href="assets/css/style-preset.css" />
    
    <style>
      .auth-main { background: #f4f7fa; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
      .auth-wrapper { width: 100%; max-width: 400px; padding: 15px; }
    </style>
  </head>

  <body data-pc-preset="preset-1" data-pc-sidebar-caption="true" data-pc-direction="ltr" data-pc-theme="light">
    <!-- [ Pre-loader ] start -->
    <div class="loader-bg">
      <div class="loader-track">
        <div class="loader-fill"></div>
      </div>
    </div>

    <div class="auth-main">
      <div class="auth-wrapper">
        <div class="auth-form">
          <div class="position-relative">
            <div class="auth-bg">
              <span class="r"></span>
              <span class="r s"></span>
              <span class="r s"></span>
              <span class="r"></span>
            </div>
            <div class="card mb-0">
              <div class="card-body">
                <div class="text-center">
                  <img src="assets/images/LogoColegioAnahuac.png" alt="img" class="img-fluid mb-4" style="max-height: 120px;" />
                </div>
                <h4 class="text-center f-w-500 mb-3">Portal Educativo</h4>
                <p class="text-muted text-center mb-4">Colegio Anáhuac</p>
                
                <div class="mb-3">
                  <label class="form-label">Usuario o Correo Institucional</label>
                  <input type="text" class="form-control" id="email" placeholder="Ingresa tu usuario (ej: alumno, profesor...)" />
                </div>
                <div class="mb-3">
                  <label class="form-label">Contraseña</label>
                  <input type="password" class="form-control" id="password" placeholder="********" />
                </div>

                <div class="d-flex mt-1 justify-content-between align-items-center">
                  <div class="form-check">
                    <input class="form-check-input input-primary" type="checkbox" id="customCheckc1" checked="" />
                    <label class="form-check-label text-muted" for="customCheckc1">Recordarme</label>
                  </div>
                  <a href="#" class="text-secondary f-w-400 mb-0">¿Olvidaste tu contraseña?</a>
                </div>
                
                <div class="text-center mt-4">
                  <button type="button" class="btn btn-primary shadow w-100" onclick="handleLogin()">Continuar</button>
                </div>
                
                <div class="text-center mt-4">
                  <h6 class="f-w-500 mb-0">¿Eres nuevo ingreso? <a href="#" class="link-primary">Más información</a></h6>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Required Js -->
    <script src="assets/js/plugins/popper.min.js"></script>
    <script src="assets/js/plugins/simplebar.min.js"></script>
    <script src="assets/js/plugins/bootstrap.min.js"></script>
    <script src="assets/js/pcoded.js"></script>

    <script>
      function handleLogin() {
        const userInput = document.getElementById('email').value.toLowerCase().trim();
        let role = 'alumno'; // Default

        // Lógica de detección de rol para el Mock
        if (userInput.includes('profesor')) {
          role = 'profesor';
        } else if (userInput.includes('administrativo')) {
          role = 'administrativo';
        } else if (userInput.includes('sistemas')) {
          role = 'sistemas';
        } else {
          role = 'alumno';
        }
        
        localStorage.setItem('portal_user_role', role);
        localStorage.setItem('portal_user_email', userInput);
        
        // Redirigimos al segundo factor de autenticación (2FA)
        window.location.href = '2fa.html';
      }
    </script>
  </body>
</html>
