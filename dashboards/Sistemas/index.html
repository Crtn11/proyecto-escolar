<!doctype html>
<html lang="es">
<head>
    <title>Dashboard IT | Colegio Anáhuac</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0, minimal-ui" />
    <link rel="icon" href="../../assets/images/IconoColegioAnahuac.png" type="image/png" />
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../assets/fonts/phosphor/regular/style.css" />
    <link rel="stylesheet" href="../../assets/fonts/tabler-icons.min.css" />
    <link rel="stylesheet" href="../../assets/css/style.css" id="main-style-link" />
    <link rel="stylesheet" href="../../assets/css/style-preset.css" />
    <style>
        .logo-lg { max-height: 55px; width: auto; }
        .pc-sidebar .m-header { padding: 10px 20px; height: 80px; display: flex; align-items: center; }
    </style>
</head>
<body data-pc-preset="preset-1" data-pc-sidebar-caption="true" data-pc-direction="ltr" data-pc-theme="light">
    <nav class="pc-sidebar">
        <div class="navbar-wrapper">
            <div class="m-header">
                <a href="#" class="b-brand"><img src="../../assets/images/LogoColegioAnahuac.png" alt="logo" class="logo-lg" /></a>
            </div>
            <div class="navbar-content">
                <ul class="pc-navbar">
                    <li class="pc-item pc-caption"><label>Sistemas</label></li>
                    <li class="pc-item"><a href="#" class="pc-link"><span class="pc-micon"><i class="ti ti-server"></i></span><span class="pc-mtext">Estado Servidores</span></a></li>
                    <li class="pc-item"><a href="#" class="pc-link"><span class="pc-micon"><i class="ti ti-lock"></i></span><span class="pc-mtext">Seguridad</span></a></li>
                    <li class="pc-item pc-caption"><label>Otros</label></li>
                    <li class="pc-item"><a href="../../login.html" class="pc-link"><span class="pc-micon"><i class="ti ti-logout"></i></span><span class="pc-mtext">Cerrar Sesión</span></a></li>
                </ul>
            </div>
        </div>
    </nav>
    <header class="pc-header"><div class="header-wrapper"><div class="me-auto pc-mob-drp"><ul class="list-unstyled"><li class="pc-h-item pc-sidebar-collapse"><a href="#" class="pc-head-link ms-0" id="sidebar-hide"><i class="ti ti-menu-2"></i></a></li></ul></div></div></header>
    <div class="pc-container">
        <div class="pc-content">
            <div class="row">
                <div class="col-md-3">
                    <div class="card">
                        <div class="card-body"><h6>CPU Usage</h6><h2>24%</h2><div class="progress m-t-10" style="height:7px;"><div class="progress-bar bg-primary" style="width: 24%"></div></div></div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card">
                        <div class="card-body"><h6>RAM Usage</h6><h2>4.2 GB</h2><div class="progress m-t-10" style="height:7px;"><div class="progress-bar bg-success" style="width: 45%"></div></div></div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header"><h5>Servicios Activos</h5></div>
                        <div class="card-body p-0">
                            <ul class="list-group list-group-flush">
                                <li class="list-group-item d-flex justify-content-between align-items-center">Web Server (Nginx) <span class="badge bg-success">Online</span></li>
                                <li class="list-group-item d-flex justify-content-between align-items-center">Database (PostgreSQL) <span class="badge bg-success">Online</span></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="../../assets/js/plugins/popper.min.js"></script>
    <script src="../../assets/js/plugins/bootstrap.min.js"></script>
    <script src="../../assets/js/pcoded.js"></script>
</body>
</html>
